# Recipe: GLM-5.3-Flash-FP4-Local + DFlash2 speculative decoding (K=7)
#
# For eugr/spark-vllm-docker. Copy into recipes/ and run with scripts/serve.sh:
#   ./run-recipe.sh recipes/glm-5.3-flash-dflash2.yaml --port 8888 --daemon \
#     -v "$HOME/models/GLM-5.3-Flash-DFlash2:/models/dflash2-draft:ro" \
#     -e VLLM_GLM53_SPLIT_TARGET_BLOCK_SIZE=5120 \
#     -e VLLM_GLM53_SPLIT_MAMBA_BLOCK_SIZE=5120 \
#     -e VLLM_ROCE_ALLGATHER_MAX_SIZE=64
#
# The three -e flags are mandatory with a drafter KV group on GLM-5.3.
# See docs/pitfalls.md before removing any of them.
#
# Verified with vllm-node-b12x built 2026-11-02
# (digest sha256:19ab778dd57f019c44caf5df91a671cf688923d1ca9fa8ce92be0c9acb46d215).

recipe_version: "1"
name: GLM-5.3-Flash-FP4-Local + DFlash2 K7
description: vLLM B12X serving nvidia/GLM-5.3-Flash-FP4-Local with the DFlash2 drafter, TP2 on a dual DGX Spark cluster

model: nvidia/GLM-5.3-Flash-FP4-Local
container: vllm-node-b12x

build_args:
  - --exp-b12x

cluster_only: true

mods: []

defaults:
  port: 8000
  host: 127.0.0.1
  tensor_parallel: 2
  decode_context_parallel: 1
  block_size: 256
  max_model_len: 524288
  max_num_seqs: 8
  max_num_batched_tokens: 4096
  num_speculative_tokens: 7
  kv_cache_memory_bytes: 8G
  gpu_memory_utilization: 0.87

env:
  PYTORCH_ALLOC_CONF: "per_process_memory_fraction:0.8"
  CUTE_DSL_ARCH: "sm_121a"
  SAFETENSORS_FAST_GPU: "1"
  VLLM_ENABLE_ROCE_ALLREDUCE: "1"
  VLLM_ROCE_ALLREDUCE_MAX_SIZE: "2MB"
  NCCL_BUFFSIZE: "1048576"
  NCCL_MAX_CTAS: "8"
  VLLM_WORKER_MULTIPROC_METHOD: "spawn"
  VLLM_SSM_CONV_STATE_LAYOUT: "DS"
  VLLM_USE_AOT_COMPILE: "1"
  VLLM_USE_MEGA_AOT_ARTIFACT: "1"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  VLLM_ENABLE_PCIE_ALLREDUCE: "0"
  B12X_POLICY_MODE: "auto"
  VLLM_B12X_MOE_FP4_FORCE_A16: "1"
  B12X_W4A16_A4_PREFILL: "1"

command: |
  vllm serve nvidia/GLM-5.3-Flash-FP4-Local \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --decode-context-parallel-size {decode_context_parallel} \
    --mamba-cache-mode align \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --dtype bfloat16 \
    --kv-cache-dtype fp8 \
    --quantization modelopt_mixed \
    --attention-backend B12X \
    --block-size {block_size} \
    --moe-backend b12x \
    --linear-backend b12x \
    --no-enable-flashinfer-autotune \
    --load-format b12x \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --speculative-config '{{"method":"dflash","model":"/models/dflash2-draft","num_speculative_tokens":{num_speculative_tokens},"kv_cache_dtype":"bfloat16"}}' \
    --reasoning-parser glm45 \
    --tool-call-parser glm47 \
    --enable-auto-tool-choice \
    --default-chat-template-kwargs '{{"reasoning_effort":"high"}}' \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --kv-cache-memory-bytes {kv_cache_memory_bytes}
